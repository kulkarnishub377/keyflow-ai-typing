<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="kfMarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10172e"/>
      <stop offset="50%" stop-color="#182348"/>
      <stop offset="100%" stop-color="#0a0f20"/>
    </linearGradient>
    <linearGradient id="kfMarkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="kfMarkFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="kfMarkStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="kfMarkArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="kfMarkLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="kfMarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Keycap -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#kfMarkBg)" stroke="url(#kfMarkBorder)" stroke-width="1.8" filter="url(#kfMarkGlow)"/>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Speed Trails -->
  <rect x="10" y="21" width="8" height="3" rx="1.5" fill="#00f2fe" opacity="0.9"/>
  <rect x="7" y="28" width="12" height="3" rx="1.5" fill="#00f2fe" opacity="0.9"/>
  <rect x="9" y="35" width="9" height="3" rx="1.5" fill="#6366f1" opacity="0.9"/>
  <rect x="12" y="42" width="6" height="3" rx="1.5" fill="#ec4899" opacity="0.9"/>

  <!-- 'K' Ribbon Shape -->
  <g transform="translate(4, 1)">
    <!-- Leg -->
    <path d="M28 32 L44 48 C45.5 49.5 48 49.5 49.5 48 C51 46.5 51 44 49.5 42.5 L36 29 Z" fill="url(#kfMarkLeg)"/>
    <!-- Arm -->
    <path d="M26 30 L43 14 C44.5 12.5 47 12.5 48.5 14 C50 15.5 50 18 48.5 19.5 L34 34 Z" fill="url(#kfMarkArm)"/>
    <!-- Stem -->
    <path d="M21 13 C21 11.5 22.5 10.5 24 11 C26.5 12 28 15 28 19 L28 41 C28 45 26 48 23 49 C21 49.5 19.5 48 19.5 46 L19.5 17 C19.5 14.5 20 13 21 13 Z" fill="url(#kfMarkStem)"/>
    <!-- Fold -->
    <path d="M20 25 C23 25 27 26 31 29 C34 31.5 33 36 29 38 C25 39.5 21 38 20 35 Z" fill="url(#kfMarkFold)" opacity="0.9"/>
  </g>
</svg>
