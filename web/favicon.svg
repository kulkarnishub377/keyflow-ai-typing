<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Dark & Light Theme Gradients -->
    <linearGradient id="kfBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b16"/>
      <stop offset="50%" stop-color="#0e1529"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="kfBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf4"/>
    </linearGradient>

    <!-- Ribbon Flow Gradients -->
    <linearGradient id="kfStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="kfFoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="kfArmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="kfLegGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Keycap Bevel Gradient -->
    <linearGradient id="kfKeyBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(99,102,241,0.6)"/>
      <stop offset="50%" stop-color="rgba(168,85,247,0.3)"/>
      <stop offset="100%" stop-color="rgba(6,182,212,0.4)"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="kfGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="kfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .bg-rect { fill: url(#kfBgDark); stroke: url(#kfKeyBorderDark); }
    .inner-bevel { stroke: rgba(255,255,255,0.1); }
    .speed-trail { fill: #00f2fe; }
    .speed-trail-2 { fill: #6366f1; }
    .speed-trail-3 { fill: #ec4899; }
    
    @media (prefers-color-scheme: light) {
      .bg-rect { fill: url(#kfBgLight); stroke: rgba(99,102,241,0.25); }
      .inner-bevel { stroke: rgba(0,0,0,0.06); }
      .speed-trail { fill: #0284c7; }
      .speed-trail-2 { fill: #4f46e5; }
      .speed-trail-3 { fill: #db2777; }
    }
  </style>

  <!-- Keycap Base Container -->
  <rect class="bg-rect" x="6" y="6" width="116" height="116" rx="28" stroke-width="2.5" filter="url(#kfShadow)"/>
  <rect class="inner-bevel" x="12" y="12" width="104" height="104" rx="22" fill="none" stroke-width="1.2"/>

  <!-- Speed Flow Trails (Left Side) -->
  <g filter="url(#kfGlow)" opacity="0.95">
    <!-- Top Speed Pill -->
    <rect class="speed-trail" x="20" y="38" width="16" height="6" rx="3"/>
    <!-- Middle Speed Pill -->
    <rect class="speed-trail" x="14" y="52" width="22" height="6" rx="3"/>
    <!-- Lower Speed Pill -->
    <rect class="speed-trail-2" x="18" y="66" width="18" height="6" rx="3"/>
    <!-- Bottom Speed Dot -->
    <rect class="speed-trail-3" x="24" y="80" width="12" height="6" rx="3"/>
  </g>

  <!-- KeyFlow 'K' Ribbon Graphic -->
  <g filter="url(#kfShadow)">
    <!-- Lower Leg (Behind) -->
    <path d="M58 64 L88 94 C91 97 96 97 99 94 C102 91 102 86 99 83 L73 57 Z" fill="url(#kfLegGrad)"/>

    <!-- Upper Arm -->
    <path d="M54 60 L86 28 C89 25 94 25 97 28 C100 31 100 36 97 39 L68 68 Z" fill="url(#kfArmGrad)"/>

    <!-- Main Vertical Stem with Smooth Curve/Fold -->
    <path d="M44 26 C44 23 47 21 50 22 C55 24 58 30 58 38 L58 82 C58 90 54 96 48 98 C44 99 41 96 41 92 L41 34 C41 29 42 26 44 26 Z" fill="url(#kfStemGrad)"/>

    <!-- Dynamic Flow Fold (Center Ribbon Knot) -->
    <path d="M42 50 C48 50 56 52 64 58 C70 63 68 72 60 76 C52 79 44 76 42 70 Z" fill="url(#kfFoldGrad)" opacity="0.9"/>
  </g>

  <!-- Glowing Core Accent Dot -->
  <circle cx="62" cy="62" r="3" fill="#ffffff" filter="url(#kfGlow)"/>
</svg>
