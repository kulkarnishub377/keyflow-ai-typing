<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="100%" stop-color="#0e1426"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243358"/>
      <stop offset="100%" stop-color="#141c33"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="126" height="126" rx="29" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Keycap Body -->
  <rect x="22" y="22" width="84" height="84" rx="20" fill="url(#brandGrad)" filter="url(#glow)" opacity="0.35"/>
  <rect x="22" y="20" width="84" height="84" rx="20" fill="url(#brandGrad)"/>
  
  <!-- Key Top Bevel -->
  <rect x="28" y="26" width="72" height="72" rx="15" fill="url(#keyGrad)"/>
  <rect x="28" y="26" width="72" height="72" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- KeyFlow Center Symbol (Cross / Cursor / Key) -->
  <path d="M64 42 V86 M42 64 H86" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="4" fill="#6366f1"/>
</svg>
