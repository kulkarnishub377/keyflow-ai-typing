<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070913">
  <meta name="description" content="KeyFlow AI Typing — local-first adaptive typing trainer and desktop learning workspace.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'self';">
  <title>KeyFlow — Adaptive Desktop Typing Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="commandPalette" class="cmd-palette-backdrop" style="display:none" onclick="if(event.target===this)closeCommandPalette()"></div>
  <div id="customLessonModal" class="cmd-palette-backdrop" style="display:none" onclick="if(event.target===this)closeCustomLessonModal()"></div>
  <div id="exitModal" class="cmd-palette-backdrop" style="display:none" onclick="if(event.target===this)closeExitModal()"></div>
  <div id="logoutModal" class="cmd-palette-backdrop" style="display:none" onclick="if(event.target===this)closeLogoutModal()"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/state.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/advanced.js"></script>
  <script src="js/arcade.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
